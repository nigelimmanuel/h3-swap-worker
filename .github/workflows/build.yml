name: Build worker image
on:
  push:
    branches: [main]
    paths: [Dockerfile, h3-boot.sh, upgrade_comfyui.py, .github/workflows/build.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Make room for the base image (about 15 GB compressed)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af > /dev/null
          # keep Docker's storage on whichever disk has more free space
          if [ -d /mnt ] && [ "$(df --output=avail /mnt | tail -1)" -gt "$(df --output=avail / | tail -1)" ]; then
            sudo systemctl stop docker docker.socket
            sudo mkdir -p /mnt/docker
            [ -s /etc/docker/daemon.json ] || echo '{}' | sudo tee /etc/docker/daemon.json > /dev/null
            sudo jq '. + {"data-root": "/mnt/docker"}' /etc/docker/daemon.json | sudo tee /etc/docker/daemon.json.new > /dev/null
            sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
            sudo systemctl start docker
          fi
          df -h / /mnt || true
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read the ComfyUI version from the Dockerfile
        id: v
        run: echo "comfy=$(sed -n 's/^ARG COMFYUI_REF=//p' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}:comfy-${{ steps.v.outputs.comfy }}
            ghcr.io/${{ github.repository }}:latest
      - name: Disk left
        if: always()
        run: df -h / /mnt || true
